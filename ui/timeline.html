<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    :root {
        color-scheme: dark;
        --ink: #f6f0ff;
        --muted: #beb4d2;
        --line: #3b3453;
        --surface: #151221;
        --panel: #1d182d;
        --amber: #ffc785;
        --lilac: #d1baff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
    main {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: linear-gradient(180deg, #181426 0%, #13101e 100%);
        box-shadow: 0 18px 40px rgba(6, 4, 14, .42);
    }
    .readout, .controls, .timeline-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: .4rem .9rem;
    }
    .readout {
        padding: .75rem 1rem;
        background: rgba(255, 255, 255, .02);
    }
    .readout small, .timeline-header span {
        display: block;
        color: var(--muted);
        font: 600 .68rem/1.5 "IBM Plex Mono", ui-monospace, monospace;
        letter-spacing: .06em;
    }
    .readout strong { font-size: .96rem; letter-spacing: -.01em; }
    #elapsed {
        color: var(--amber);
        font: 650 .74rem/1.4 "IBM Plex Mono", ui-monospace, monospace;
        background: rgba(255, 199, 133, .1);
        border: 1px solid rgba(255, 199, 133, .28);
        border-radius: 999px;
        padding: .22rem .68rem;
    }
    .stage {
        position: relative;
        display: grid;
        place-items: center;
        overflow: hidden;
        height: clamp(220px, 58vw, 330px);
        border-block: 1px solid var(--line);
        background:
            radial-gradient(circle at center, rgba(209, 186, 255, .1) 0%, transparent 58%),
            radial-gradient(ellipse at center, #1b152b 0%, #090710 78%);
    }
    .stage::after {
        content: "";
        position: absolute;
        inset: 10px;
        border: 1px solid rgba(209, 186, 255, .1);
        border-radius: 10px;
        pointer-events: none;
    }
    .stage img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        image-rendering: pixelated;
        min-height: 0;
        transform-origin: center center;
        transition: transform .18s ease-out;
        filter: drop-shadow(0 0 22px rgba(0, 0, 0, .65));
    }
    .reticle {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity .15s ease;
    }
    .stage[data-reticle="true"] .reticle { opacity: 1; }
    .reticle::before, .reticle::after {
        content: "";
        position: absolute;
        background: rgba(255, 199, 133, .48);
    }
    .reticle::before { left: 50%; top: 0; bottom: 0; width: 1px; transform: translateX(-.5px); }
    .reticle::after { top: 50%; left: 0; right: 0; height: 1px; transform: translateY(-.5px); }
    .reticle-ring {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 36px;
        height: 36px;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(209, 186, 255, .72);
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgba(13, 11, 21, .5);
    }
    .timeline { padding: .75rem 1rem .85rem; }
    .timeline-header { margin-bottom: .25rem; }
    .timeline-header strong { font-size: .88rem; letter-spacing: -.01em; }
    input { accent-color: var(--amber); cursor: pointer; }
    #seek { width: 100%; margin: .2rem 0 .4rem; }
    .dates {
        position: relative;
        display: flex;
        gap: .4rem;
        overflow: auto;
        scrollbar-width: thin;
        padding: 2px 2px 6px;
    }
    button, select {
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel);
        color: var(--ink);
        padding: .22rem .66rem;
        font: inherit;
        transition: border-color .15s ease, background-color .15s ease, color .15s ease, box-shadow .15s ease;
    }
    button { cursor: pointer; }
    button:hover:not(:disabled),
    select:hover {
        border-color: var(--lilac);
        background: #27203b;
    }
    .dates button[aria-current="true"] {
        border-color: var(--amber);
        color: var(--amber);
        background: #2d2134;
        box-shadow: 0 0 0 1px rgba(255, 199, 133, .28);
    }
    button:disabled { color: var(--muted); opacity: .45; cursor: default; }
    :focus-visible { outline: 2px solid var(--lilac); outline-offset: 2px; }
    .dates button {
        flex: none;
        font: 600 .72rem/1.3 "IBM Plex Mono", ui-monospace, monospace;
        border-radius: 999px;
        padding: .2rem .75rem;
    }
    .controls {
        margin-top: .45rem;
        padding-top: .55rem;
        border-top: 1px solid rgba(59, 52, 83, .65);
    }
    .transport, .speed, .zoom, .loop, .reticle-toggle {
        display: flex;
        align-items: center;
        gap: .38rem;
    }
    .speed, .zoom, .loop, .reticle-toggle, a { color: var(--muted); font-size: .78rem; }
    .loop input, .reticle-toggle input { width: 1rem; height: 1rem; margin: 0; }
    a {
        text-underline-offset: .2em;
        color: var(--lilac);
        font-weight: 500;
    }
    a:hover { color: var(--amber); }
    #play {
        min-width: 6.4rem;
        border-color: transparent;
        color: #1f1328;
        background: linear-gradient(110deg, #ffc785, #e8b1ff);
        font-weight: 750;
        box-shadow: 0 4px 14px rgba(255, 199, 133, .18);
    }
    #play:hover { filter: brightness(1.06); }
    @media (max-width: 480px) {
        .readout, .timeline { padding-inline: .65rem; }
        .controls { justify-content: flex-start; gap: .45rem .7rem; }
        #elapsed { font-size: .68rem; }
    }
</style>
</head>
<body>
<main aria-label="SPHEREx observation time-lapse">
    <header class="readout">
        <div><small>OBSERVATION DATE</small><strong id="date"></strong></div>
        <span id="elapsed"></span>
    </header>
    <div id="stage" class="stage" data-reticle="false">
        <img id="image" alt="SPHEREx infrared observation cutout">
        <div class="reticle" aria-hidden="true"><div class="reticle-ring"></div></div>
    </div>
    <section class="timeline" aria-label="Observation timeline">
        <div class="timeline-header"><strong>Observation timeline</strong><span id="position"></span></div>
        <input id="seek" type="range" min="0" value="0" aria-label="Jump to a visit">
        <div id="dates" class="dates" aria-label="Visit dates"></div>
        <div class="controls">
            <div class="transport">
                <button type="button" id="previous" aria-label="Previous observation">←</button>
                <button type="button" id="play">▶ Play</button>
                <button type="button" id="next" aria-label="Next observation">→</button>
            </div>
            <div class="speed">
                <label for="speed">Speed</label>
                <select id="speed">
                    <option value="2600">0.5×</option>
                    <option value="1300" selected>1×</option>
                    <option value="650">2×</option>
                    <option value="325">4×</option>
                </select>
            </div>
            <div class="zoom">
                <label for="zoom">Zoom</label>
                <select id="zoom" aria-label="Zoom level">
                    <option value="1" selected>1×</option>
                    <option value="2">2×</option>
                    <option value="3">3×</option>
                </select>
            </div>
            <label class="reticle-toggle"><input id="reticle" type="checkbox"> Crosshair</label>
            <label class="loop"><input id="loop" type="checkbox" checked> Loop</label>
            <a id="source" target="_blank" rel="noopener noreferrer" hidden>FITS source ↗</a>
        </div>
    </section>
</main>
<script id="frames" type="application/json">$frames</script>
<script>
const get = (id) => document.getElementById(id);
const frames = JSON.parse(get("frames").textContent);
const date = get("date");
const stage = get("stage");
const image = get("image");
const elapsed = get("elapsed");
const position = get("position");
const seek = get("seek");
const dates = get("dates");
const play = get("play");
const speed = get("speed");
const zoom = get("zoom");
const reticle = get("reticle");
const loop = get("loop");
const previous = get("previous");
const next = get("next");
const source = get("source");
const last = frames.length - 1;
let index = 0;
let timer = null;

const dateButtons = frames.map((frame, i) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = /^\d{4}-\d{2}-\d{2}/.test(frame.date) ? frame.date.slice(0, 10) : frame.date;
    button.setAttribute("aria-label", "Visit " + (i + 1) + " · " + frame.date);
    button.addEventListener("click", () => jump(i));
    dates.append(button);
    return button;
});
seek.max = last;

function formatElapsed(days) {
    if (days >= 1) return days.toFixed(2) + " days";
    if (days >= 1 / 24) return (days * 24).toFixed(2) + " hours";
    if (days >= 1 / 1440) return (days * 1440).toFixed(1) + " min";
    return (days * 86400).toFixed(1) + " sec";
}

function show() {
    const frame = frames[index];
    image.src = frame.image;
    image.alt = "SPHEREx infrared cutout, " + frame.date;
    date.textContent = frame.date.replace(/(\d)T/, "$$1 ");
    elapsed.textContent = index === 0 ? "First visit" : "+" + formatElapsed(frame.mjd - frames[0].mjd) + " since first visit";
    position.textContent = "Visit " + (index + 1) + " / " + frames.length + (frame.wavelength ? " · " + frame.wavelength : "");
    seek.value = index;
    seek.setAttribute("aria-valuetext", "Visit " + (index + 1) + ", " + frame.date);
    previous.disabled = index === 0;
    next.disabled = index === last;
    source.hidden = !frame.source;
    if (frame.source) source.href = frame.source;
    else source.removeAttribute("href");
    dateButtons.forEach((button, i) => button.setAttribute("aria-current", i === index ? "true" : "false"));
    const active = dateButtons[index];
    if (active.offsetLeft < dates.scrollLeft || active.offsetLeft + active.offsetWidth > dates.scrollLeft + dates.clientWidth) {
        dates.scrollLeft = active.offsetLeft;
    }
}

function pause() {
    if (timer !== null) window.clearInterval(timer);
    timer = null;
    play.textContent = "▶ Play";
}

function start() {
    play.textContent = "❚❚ Pause";
    timer = window.setInterval(() => {
        if (index === last && !loop.checked) {
            pause();
            return;
        }
        index = (index + 1) % frames.length;
        show();
        if (index === last && !loop.checked) pause();
    }, Number(speed.value));
}

function jump(visit) {
    pause();
    index = Math.max(0, Math.min(last, visit));
    show();
}

play.addEventListener("click", () => {
    if (timer !== null) {
        pause();
        return;
    }
    if (index === last) jump(0);
    start();
});
previous.addEventListener("click", () => jump(index - 1));
next.addEventListener("click", () => jump(index + 1));
seek.addEventListener("input", () => jump(Number(seek.value)));
speed.addEventListener("change", () => {
    if (timer !== null) {
        pause();
        start();
    }
});
zoom.addEventListener("change", () => {
    image.style.transform = "scale(" + Number(zoom.value) + ")";
});
reticle.addEventListener("change", () => {
    stage.dataset.reticle = reticle.checked ? "true" : "false";
});
document.addEventListener("visibilitychange", () => {
    if (document.hidden) pause();
});
show();
</script>
</body>
</html>
